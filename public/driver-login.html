<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول السائق - Thunder</title><link rel="stylesheet" href="/style.css">
</head><body>
<div class="hdr"><img src="/logo.svg" width="80" height="80" alt="Thunder"><h1 class="brand">THUNDER</h1><div class="brand-sub">DRIVER</div></div>
<div class="container fi" style="margin-top:24px"><div class="card"><h3 style="text-align:center;margin-bottom:16px">دخول السائق</h3><input id="p" placeholder="رقم الهاتف" class="inp" style="width:100%;padding:14px;background:#0a0a0a;border:2px solid #222;border-radius:12px;color:#fff;font-size:15px;margin-bottom:12px;box-sizing:border-box"><input id="w" type="password" placeholder="كلمة المرور" class="inp" style="width:100%;padding:14px;background:#0a0a0a;border:2px solid #222;border-radius:12px;color:#fff;font-size:15px;margin-bottom:16px;box-sizing:border-box"><button class="btn" onclick="L()">دخول</button><div id="m" style="padding:12px;border-radius:10px;margin-top:12px;text-align:center;font-size:13px;display:none"></div></div></div>
<script>function L(){var b=document.querySelector(".btn"),m=document.getElementById("m");b.disabled=true;b.textContent="جاري...";m.style.display="none";fetch("/api/driver/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:document.getElementById("p").value,password:document.getElementById("w").value})}).then(function(r){return r.json()}).then(function(d){if(d.token){localStorage.setItem("driverToken",d.token);localStorage.setItem("driver",JSON.stringify(d.driver));m.style.background="#065f46";m.style.color="#6ee7b7";m.textContent="✅ أهلاً "+d.driver.full_name;m.style.display="block";setTimeout(function(){location.href="/driver.html"},800)}else{m.style.background="#7f1d1d";m.style.color="#fca5a5";m.textContent="❌ "+(d.error||"خطأ");m.style.display="block";b.disabled=false;b.textContent="دخول"}})}</script></body></html>
