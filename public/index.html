<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thunder - تسجيل الدخول</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:linear-gradient(135deg,#1e3a8a,#7c3aed);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.logo{text-align:center;font-size:48px;margin-bottom:8px}
h1{text-align:center;color:#1e3a8a;font-size:24px;margin-bottom:4px}
.sub{text-align:center;color:#666;font-size:13px;margin-bottom:24px}
.tabs{display:flex;gap:8px;margin-bottom:20px;background:#f1f5f9;padding:4px;border-radius:10px}
.tab{flex:1;padding:10px;text-align:center;cursor:pointer;border-radius:8px;font-size:14px;font-weight:600;color:#666}
.tab.active{background:#fff;color:#1e3a8a;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input{width:100%;padding:14px 16px;border:2px solid #e2e8f0;border-radius:10px;font-size:15px;margin-bottom:12px;outline:none}
input:focus{border-color:#7c3aed}
button{width:100%;padding:14px;background:linear-gradient(135deg,#1e3a8a,#7c3aed);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.msg{margin-top:16px;padding:12px;border-radius:10px;font-size:13px;display:none;word-break:break-all}
.msg.error{background:#fee2e2;color:#991b1b;display:block}
.msg.success{background:#dcfce7;color:#166534;display:block}
.msg.info{background:#dbeafe;color:#1e40af;display:block}
#debug{margin-top:12px;padding:10px;background:#111;color:#0f0;font-family:monospace;font-size:11px;border-radius:8px;max-height:200px;overflow:auto;white-space:pre-wrap;display:none}
</style>
</head>
<body>
<div class="card">
<div class="logo">⚡</div>
<h1>Thunder Delivery</h1>
<p class="sub">توصيل سريع في السودان</p>

<div class="tabs">
<div class="tab active" onclick="switchTab('login')">دخول</div>
<div class="tab" onclick="switchTab('register')">تسجيل جديد</div>
</div>

<form id="loginForm">
<input id="loginPhone" type="tel" placeholder="رقم الهاتف" required>
<input id="loginPassword" type="password" placeholder="كلمة المرور" required>
<button type="submit" id="loginBtn">تسجيل الدخول</button>
</form>

<form id="registerForm" style="display:none">
<input id="regName" type="text" placeholder="الاسم الكامل" required>
<input id="regPhone" type="tel" placeholder="رقم الهاتف" required>
<input id="regPassword" type="password" placeholder="كلمة المرور" required>
<button type="submit" id="regBtn">إنشاء حساب</button>
</form>

<div id="msg" class="msg"></div>
<div id="debug"></div>
</div>

<script>
var API = location.origin + "/api";
var msg = document.getElementById("msg");
var dbg = document.getElementById("debug");

function log(s) {
  dbg.style.display = "block";
  dbg.textContent += s + "\n";
  dbg.scrollTop = dbg.scrollHeight;
}

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = "msg " + type;
}

function switchTab(which) {
  document.querySelectorAll(".tab").forEach(function(t, i) {
    t.classList.toggle("active", (which === "login" && i === 0) || (which === "register" && i === 1));
  });
  document.getElementById("loginForm").style.display = which === "login" ? "block" : "none";
  document.getElementById("registerForm").style.display = which === "register" ? "block" : "none";
  msg.className = "msg";
}

document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  var btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.textContent = "جاري...";
  showMsg("جاري الإرسال...", "info");
  log("---- LOGIN ----");

  var phone = document.getElementById("loginPhone").value.trim();
  var password = document.getElementById("loginPassword").value;
  log("phone=" + phone);
  log("API=" + API);

  try {
    var r = await fetch(API + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: phone, password: password })
    });
    log("status=" + r.status);
    var text = await r.text();
    log("body=" + text);
    var d;
    try { d = JSON.parse(text); } catch (err) { throw new Error("رد غير صالح: " + text); }
    if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
    localStorage.setItem("token", d.token);
    localStorage.setItem("user", JSON.stringify(d.user));
    showMsg("نجح! جاري التحويل...", "success");
    setTimeout(function() { location.href = "/app.html"; }, 800);
  } catch (err) {
    log("ERROR: " + err.message);
    showMsg("خطأ: " + err.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "تسجيل الدخول";
  }
});

document.getElementById("registerForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  var btn = document.getElementById("regBtn");
  btn.disabled = true;
  btn.textContent = "جاري...";
  showMsg("جاري الإرسال...", "info");
  log("---- REGISTER ----");

  var full_name = document.getElementById("regName").value.trim();
  var phone = document.getElementById("regPhone").value.trim();
  var password = document.getElementById("regPassword").value;
  log("phone=" + phone);

  try {
    var r = await fetch(API + "/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ full_name: full_name, phone: phone, password: password })
    });
    log("status=" + r.status);
    var text = await r.text();
    log("body=" + text);
    var d;
    try { d = JSON.parse(text); } catch (err) { throw new Error("رد غير صالح: " + text); }
    if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
    localStorage.setItem("token", d.token);
    localStorage.setItem("user", JSON.stringify(d.user));
    showMsg("تم إنشاء الحساب!", "success");
    setTimeout(function() { location.href = "/app.html"; }, 800);
  } catch (err) {
    log("ERROR: " + err.message);
    showMsg("خطأ: " + err.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "إنشاء حساب";
  }
});
</script>
</body>
</html>
