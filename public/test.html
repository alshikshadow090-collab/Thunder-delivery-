<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>اختبار</title>
<style>
body{background:#1e3a8a;color:#fff;font-family:sans-serif;padding:20px}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;font-size:16px}
button{background:#4ade80;color:#000;font-weight:bold}
#log{background:#000;color:#0f0;padding:10px;font-family:monospace;font-size:12px;white-space:pre-wrap;margin-top:12px;border-radius:8px;min-height:200px}
</style>
</head>
<body>
<h1>🔧 اختبار Thunder</h1>
<input id="phone" value="+249912345678" placeholder="رقم">
<input id="password" value="test1234" type="text" placeholder="كلمة المرور">
<button onclick="testConn()">1. اختبار الاتصال</button>
<button onclick="doLogin()">2. تسجيل الدخول</button>
<div id="log">📋 السجل:
</div>
<script>
const L=document.getElementById("log");
function log(m,c){L.innerHTML+='\n<span style="color:'+(c||'#0f0')+'">'+m+'</span>';}
async function testConn(){
  log("→ اختبار /api/health");
  try{
    const r=await fetch("/api/health");
    const d=await r.json();
    log("✅ "+JSON.stringify(d));
  }catch(e){log("❌ "+e.message,"#f00");}
}
async function doLogin(){
  log("→ بدء الدخول...");
  const p=document.getElementById("phone").value;
  const pw=document.getElementById("password").value;
  log("Phone: "+p+" | PassLen: "+pw.length);
  try{
    const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:p,password:pw})});
    log("HTTP Status: "+r.status);
    const d=await r.json();
    log("Response: "+JSON.stringify(d).slice(0,300));
    if(r.ok){log("✅ نجح!","#0f0");localStorage.setItem("token",d.token);}
    else{log("❌ فشل: "+(d.error||""), "#f00");}
  }catch(e){log("❌ خطأ: "+e.message,"#f00");}
}
</script>
</body>
</html>
