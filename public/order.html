<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب جديد - Thunder</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><link rel="stylesheet" href="/style.css">
<style>.topbar{background:#000;color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #FFD700;position:sticky;top:0;z-index:1000}.topbar a{color:#FFD700;text-decoration:none;font-size:24px;font-weight:900}.topbar h1{margin:0;font-size:18px;font-weight:700;letter-spacing:1px}.form-group{margin-bottom:16px}.form-group label{display:block;color:#FFD700;font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:8px;text-transform:uppercase}.inp{width:100%;padding:14px 16px;background:#0a0a0a;border:2px solid #222;border-radius:12px;color:#fff;font-size:15px;font-family:inherit;outline:none;transition:.2s}.inp:focus{border-color:#FFD700;box-shadow:0 0 0 3px rgba(255,215,0,.15)}#map{height:280px;border-radius:16px;border:2px solid #222;margin-bottom:16px}.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.mode-btn{padding:14px;border:2px solid #222;background:#141414;color:#888;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;transition:.2s}.mode-btn.active-p{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;border-color:#22c55e;box-shadow:0 4px 20px rgba(34,197,94,.4)}.mode-btn.active-d{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;border-color:#ef4444;box-shadow:0 4px 20px rgba(239,68,68,.4)}.msg{padding:14px;border-radius:12px;margin-top:16px;text-align:center;font-size:14px;font-weight:600;display:none}.msg.show{display:block;animation:fIn .3s ease}.msg.ok{background:linear-gradient(135deg,#065f46,#10b981);color:#fff}.msg.err{background:linear-gradient(135deg,#7f1d1d,#dc2626);color:#fff}.submit-btn{padding:18px;font-size:16px;background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;font-weight:900;border:none;border-radius:14px;cursor:pointer;width:100%;letter-spacing:2px;text-transform:uppercase;box-shadow:0 8px 30px rgba(255,215,0,.3);transition:.2s}.submit-btn:active{transform:scale(.97);box-shadow:0 4px 15px rgba(255,215,0,.4)}.wa-btn{padding:16px;font-size:15px;background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;font-weight:700;border:none;border-radius:14px;cursor:pointer;width:100%;margin-top:10px;display:none;box-shadow:0 8px 30px rgba(37,211,102,.3)}.wa-btn.show{display:block}</style></head><body>
<div class="topbar"><a href="/app.html">→</a><h1>⚡ طلب توصيل جديد</h1></div>
<div class="container fi" style="margin-top:20px">
<div id="map"></div>
<div class="mode-row"><button class="mode-btn active-p" id="mp">📍 استلام</button><button class="mode-btn" id="md">🎯 تسليم</button></div>
<div class="card"><div class="form-group"><label>نوع الطلب</label><select id="tid" class="inp"><option value="1">🚚 توصيل عادي</option><option value="2">⚡ توصيل سريع</option><option value="3">🍔 مطعم</option><option value="4">💊 صيدلية</option></select></div>
<div class="form-group"><label>📍 موقع الاستلام - خط العرض</label><input id="plat" type="number" step="0.0001" value="15.5007" class="inp"></div>
<div class="form-group"><label>📍 موقع الاستلام - خط الطول</label><input id="plng" type="number" step="0.0001" value="32.5599" class="inp"></div>
<div class="form-group"><label>عنوان الاستلام</label><input id="paddr" type="text" placeholder="مثال: الخرطوم - الرياض" class="inp"></div>
<div class="form-group"><label>🎯 موقع التسليم - خط العرض</label><input id="dlat" type="number" step="0.0001" value="15.6007" class="inp"></div>
<div class="form-group"><label>🎯 موقع التسليم - خط الطول</label><input id="dlng" type="number" step="0.0001" value="32.6500" class="inp"></div>
<div class="form-group"><label>عنوان التسليم</label><input id="daddr" type="text" placeholder="مثال: الخرطوم - بحري" class="inp"></div>
<div class="form-group" style="margin-bottom:20px"><label>ملاحظات (اختياري)</label><textarea id="notes" rows="2" placeholder="تفاصيل إضافية..." class="inp"></textarea></div>
<button class="submit-btn" id="sb">تأكيد الطلب</button><button class="wa-btn" id="wa">📱 مشاركة على WhatsApp</button><div class="msg" id="m"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var T=localStorage.getItem("token");if(!T){location.href="/enter.html"}
var map=L.map("map").setView([15.5007,32.5599],12);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
var iconP=L.divIcon({className:"",html:"<div style=\"background:#22c55e;width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 15px #22c55e\"></div>",iconSize:[24,24]});var iconD=L.divIcon({className:"",html:"<div style=\"background:#ef4444;width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 15px #ef4444\"></div>",iconSize:[24,24]});var mP=L.marker([15.5007,32.5599],{icon:iconP}).addTo(map);var mD=L.marker([15.6007,32.6500],{icon:iconD}).addTo(map);var mode="p";
map.on("click",function(e){var la=e.latlng.lat.toFixed(4);var ln=e.latlng.lng.toFixed(4);if(mode==="p"){mP.setLatLng([la,ln]);document.getElementById("plat").value=la;document.getElementById("plng").value=ln}else{mD.setLatLng([la,ln]);document.getElementById("dlat").value=la;document.getElementById("dlng").value=ln}});
document.getElementById("mp").onclick=function(){mode="p";this.className="mode-btn active-p";document.getElementById("md").className="mode-btn"};document.getElementById("md").onclick=function(){mode="d";this.className="mode-btn active-d";document.getElementById("mp").className="mode-btn"};
document.getElementById("sb").onclick=function(){var b=this;var m=document.getElementById("m");b.disabled=true;b.textContent="جاري الإرسال...";m.className="msg";fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+T},body:JSON.stringify({type_id:parseInt(document.getElementById("tid").value),pickup_lat:parseFloat(document.getElementById("plat").value),pickup_lng:parseFloat(document.getElementById("plng").value),pickup_address_text:document.getElementById("paddr").value,dropoff_lat:parseFloat(document.getElementById("dlat").value),dropoff_lng:parseFloat(document.getElementById("dlng").value),dropoff_address_text:document.getElementById("daddr").value,notes:document.getElementById("notes").value,currency:"SDG"})}).then(function(r){return r.json()}).then(function(d){if(d.order_id){m.className="msg ok show";m.textContent="✅ تم الطلب #"+d.order_id+" - "+d.estimated_price+" "+d.currency;document.getElementById("wa").className="wa-btn show";setTimeout(function(){location.href="/app.html"},3000)}else{m.className="msg err show";m.textContent="❌ "+(d.error||"خطأ");b.disabled=false;b.textContent="تأكيد الطلب"}}).catch(function(e){m.className="msg err show";m.textContent="❌ "+e.message;b.disabled=false;b.textContent="تأكيد الطلب"})};
document.getElementById("wa").onclick=function(){var t="🚚 طلب توصيل جديد%0A"+"نوع: "+document.getElementById("tid").options[document.getElementById("tid").selectedIndex].text+"%0A"+"من: "+document.getElementById("paddr").value+"%0A"+"إلى: "+document.getElementById("daddr").value+"%0A"+"الموقع: https://maps.google.com/?q="+document.getElementById("dlat").value+","+document.getElementById("dlng").value;window.open("https://wa.me/?text="+t,"_blank")};
</script></body></html>
