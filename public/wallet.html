<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المحفظة - Thunder</title><link rel="stylesheet" href="/style.css">
<style>.topbar{background:#000;color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #FFD700;position:sticky;top:0;z-index:100}.topbar a{color:#FFD700;text-decoration:none;font-size:24px;font-weight:900}.topbar h1{margin:0;font-size:18px}.balance-card{background:linear-gradient(135deg,#FFD700,#FFA500);border-radius:20px;padding:24px;text-align:center;color:#000;margin-bottom:20px;box-shadow:0 10px 40px rgba(255,215,0,.4)}.balance-card h2{margin:0 0 8px;font-size:14px;letter-spacing:2px;text-transform:uppercase;opacity:.7}.balance-card .amount{font-size:42px;font-weight:900;margin:0;line-height:1}.balance-card .cur{font-size:16px;opacity:.7;margin-top:4px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}.action-btn{padding:16px;border:2px solid;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;background:transparent;transition:.2s}.action-btn.dep{border-color:#16a34a;color:#16a34a}.action-btn.dep:active{background:#16a34a;color:#fff}.action-btn.wd{border-color:#dc2626;color:#dc2626}.action-btn.wd:active{background:#dc2626;color:#fff}.tx{background:#141414;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}.tx .info{flex:1}.tx .info h4{margin:0 0 4px;color:#fff;font-size:14px}.tx .info p{margin:0;color:#666;font-size:11px}.tx .amt{font-weight:900;font-size:16px}.tx .amt.pos{color:#22c55e}.tx .amt.neg{color:#ef4444}.empty{text-align:center;color:#666;padding:20px}</style></head><body>
<div class="topbar"><a href="/app.html">→</a><h1>💰 محفظتي</h1></div>
<div class="container fi" style="margin-top:20px">
<div class="balance-card"><h2>الرصيد الحالي</h2><p class="amount" id="bal">0.00</p><div class="cur">SDG</div></div>
<div class="actions"><button class="action-btn dep" onclick="deposit()">➕ إيداع</button><button class="action-btn wd" onclick="withdraw()">➖ سحب</button></div>
<h3 style="color:#FFD700;margin:20px 0 12px;font-size:16px">📋 سجل المعاملات</h3>
<div id="txs"><p class="empty">جاري التحميل...</p></div></div>
<script>
var T=localStorage.getItem("token");if(!T){location.href="/enter.html"}
function load(){fetch("/api/wallet",{headers:{Authorization:"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){document.getElementById("bal").textContent=(d.wallet?d.wallet.balance:0);var t=document.getElementById("txs");if(!d.transactions||!d.transactions.length){t.innerHTML="<p class=\"empty\">لا توجد معاملات بعد</p>";return}t.innerHTML=d.transactions.map(function(x){var pos=Number(x.amount)>0;var label=x.tx_type==="deposit"?"إيداع":x.tx_type==="withdraw"?"سحب":"معاملة";return"<div class=\"tx\"><div class=\"info\"><h4>"+label+"</h4><p>"+new Date(x.created_at).toLocaleDateString("ar-EG")+"</p></div><div class=\"amt "+(pos?"pos":"neg")+"\">"+(pos?"+":"")+x.amount+" SDG</div></div>"}).join("")})}
function deposit(){var a=prompt("أدخل المبلغ للإيداع (SDG):","1000");if(!a)return;fetch("/api/wallet/deposit",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+T},body:JSON.stringify({amount:parseFloat(a)})}).then(function(r){return r.json()}).then(function(d){if(d.wallet_id){alert("✅ تم الإيداع بنجاح! الرصيد الجديد: "+d.balance+" SDG");load()}else{alert("❌ "+(d.error||"خطأ"))}})}
function withdraw(){var a=prompt("أدخل المبلغ للسحب (SDG):","500");if(!a)return;fetch("/api/wallet/withdraw",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+T},body:JSON.stringify({amount:parseFloat(a)})}).then(function(r){return r.json()}).then(function(d){if(d.wallet_id){alert("✅ تم السحب بنجاح! الرصيد الجديد: "+d.balance+" SDG");load()}else{alert("❌ "+(d.error||"خطأ"))}})}
load();
</script></body></html>
