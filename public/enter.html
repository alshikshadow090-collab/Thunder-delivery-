<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thunder Delivery</title><link rel="stylesheet" href="/style.css"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#000000">
</head><body>
<div class="hdr"><img src="/logo.svg" width="100" height="100" alt="Thunder"><h1 class="brand">THUNDER</h1><div class="brand-sub">DELIVERY</div></div>
<div class="container fi" style="margin-top:24px"><div class="card"><h3 style="text-align:center;margin-bottom:16px">تسجيل الدخول</h3><input id="p" placeholder="رقم الهاتف" style="width:100%;padding:14px;background:#0a0a0a;border:2px solid #222;border-radius:12px;color:#fff;font-size:15px;margin-bottom:12px;font-family:inherit;outline:none"><input id="w" type="password" placeholder="كلمة المرور" style="width:100%;padding:14px;background:#0a0a0a;border:2px solid #222;border-radius:12px;color:#fff;font-size:15px;margin-bottom:16px;font-family:inherit;outline:none"><button class="btn" onclick="L()">دخول</button><div style="text-align:center;margin-top:14px;color:#888;font-size:13px">ليس لديك حساب؟ <a href="/register.html" style="color:#FFD700;font-weight:700;text-decoration:none">سجل الآن</a></div><div id="m" style="padding:12px;border-radius:10px;margin-top:12px;text-align:center;font-size:13px;display:none"></div></div></div>
<script>function L(){var b=document.querySelector(".btn"),m=document.getElementById("m");b.disabled=true;b.textContent="جاري...";m.style.display="none";fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:document.getElementById("p").value,password:document.getElementById("w").value})}).then(function(r){return r.json()}).then(function(d){if(d.token){localStorage.setItem("token",d.token);localStorage.setItem("user",JSON.stringify(d.user));m.style.background="#065f46";m.style.color="#6ee7b7";m.textContent="✅ أهلاً "+d.user.full_name;m.style.display="block";setTimeout(function(){location.href="/app.html"},800)}else{m.style.background="#7f1d1d";m.style.color="#fca5a5";m.textContent="❌ "+(d.error||"خطأ");m.style.display="block";b.disabled=false;b.textContent="دخول"}})}if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script></body></html>
