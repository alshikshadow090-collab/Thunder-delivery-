<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة السائق - Thunder</title><link rel="stylesheet" href="/style.css">
<style>.topbar{background:#000;padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #FFD700;position:sticky;top:0;z-index:100}.topbar h1{margin:0;font-size:16px;color:#FFD700}.status-toggle{padding:8px 16px;border-radius:20px;border:2px solid;font-size:12px;font-weight:700;cursor:pointer;background:transparent}.status-toggle.on{background:#16a34a;color:#fff;border-color:#16a34a}.status-toggle.off{background:#dc2626;color:#fff;border-color:#dc2626}.order-card{background:#141414;border:2px solid #222;border-radius:16px;padding:16px;margin-bottom:12px;transition:.2s}.order-card.new{border-color:#FFD700;box-shadow:0 0 20px rgba(255,215,0,.2)}.order-card h4{color:#FFD700;margin:0 0 8px;font-size:15px}.order-card .addr{color:#ccc;font-size:13px;margin:4px 0}.order-card .price{color:#FFD700;font-weight:900;font-size:18px;margin:8px 0}.order-card .actions{display:flex;gap:8px;margin-top:12px}.order-card .actions button{flex:1;padding:12px;border:0;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer}.accept-btn{background:#16a34a;color:#fff}.complete-btn{background:#FFD700;color:#000}.tab-btn{flex:1;padding:12px;background:#141414;color:#888;border:2px solid #222;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;transition:.2s}.tab-btn.active{background:#FFD700;color:#000;border-color:#FFD700}</style></head><body>
<div class="topbar"><h1>🚗 لوحة السائق</h1><button class="status-toggle off" id="st" onclick="toggleStatus()">غير متصل</button></div>
<div class="container fi" style="margin-top:16px"><div style="display:flex;gap:10px;margin-bottom:16px"><button class="tab-btn active" id="tabA" onclick="showTab(1)">📋 الطلبات المتاحة</button><button class="tab-btn" id="tabB" onclick="showTab(2)">✅ طلباتي</button></div><div id="content"></div>
<button class="btn red" onclick="logout()" style="margin-top:20px">تسجيل الخروج</button></div>
<script>
var T=localStorage.getItem("driverToken");var D=JSON.parse(localStorage.getItem("driver")||"null");if(!T||!D){location.href="/driver-login.html"}var currentTab=1;var isOnline=false;
function toggleStatus(){fetch("/api/driver/status",{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:"Bearer "+T},body:JSON.stringify({is_online:!isOnline})}).then(function(r){return r.json()}).then(function(d){isOnline=d.is_online;var st=document.getElementById("st");st.textContent=isOnline?"متصل ✓":"غير متصل";st.className="status-toggle "+(isOnline?"on":"off")})}
function showTab(n){currentTab=n;document.getElementById("tabA").className="tab-btn"+(n===1?" active":"");document.getElementById("tabB").className="tab-btn"+(n===2?" active":"");loadTab()}
function loadTab(){var url=currentTab===1?"/api/driver/orders/available":"/api/driver/orders";fetch(url,{headers:{Authorization:"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){var c=document.getElementById("content");if(!Array.isArray(d)||!d.length){c.innerHTML="<div class=\"card\" style=\"text-align:center;color:#666\">"+(currentTab===1?"لا توجد طلبات متاحة":"لا توجد طلبات")+"</div>";return}c.innerHTML=d.map(function(o){var addr=""+(o.pickup_address_text||"موقع "+o.pickup_lat)+" → "+(o.dropoff_address_text||"موقع "+o.dropoff_lat);var actions=currentTab===1?"<div class=\"actions\"><button class=\"accept-btn\" onclick=\"acceptOrder("+o.order_id+")\">✅ قبول الطلب</button></div>":"<div class=\"actions\"><button class=\"complete-btn\" onclick=\"completeOrder("+o.order_id+")\">✔️ إكمال</button></div>";return"<div class=\"order-card"+(currentTab===1?" new":"")+"\"><h4>#"+o.order_id+" • "+o.type_name+"</h4><div class=\"addr\">📍 "+addr+"</div>"+(o.distance_km?"<div class=\"addr\">المسافة: "+o.distance_km+" كم</div>":"")+"<div class=\"price\">"+o.estimated_price+" "+o.currency+"</div>"+actions+"</div>"}).join("")})}
function acceptOrder(id){if(!confirm("قبول الطلب #"+id+"؟"))return;fetch("/api/driver/orders/"+id+"/accept",{method:"POST",headers:{Authorization:"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){if(d.order_id){alert("✅ تم القبول! الطلب #"+d.order_id);showTab(2)}else{alert("❌ "+(d.error||"خطأ"))}})}
function completeOrder(id){if(!confirm("إكمال الطلب #"+id+"؟"))return;fetch("/api/driver/orders/"+id+"/complete",{method:"POST",headers:{Authorization:"Bearer "+T}}).then(function(r){return r.json()}).then(function(d){if(d.order_id){alert("✅ تم الإكمال!");loadTab()}else{alert("❌ "+(d.error||"خطأ"))}})}
function logout(){localStorage.removeItem("driverToken");localStorage.removeItem("driver");location.href="/driver-login.html"}
loadTab();
</script></body></html>
